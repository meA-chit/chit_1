<script>
// Apply the saved look before first paint (same keys as the app below), so a light or Spectrum choice does not flash dark.
try{var a=JSON.parse(localStorage.getItem("chitkids.appearance")||"null")||{},q=new URLSearchParams(location.search),m=q.get("theme")||a.mode;
if(m==="auto")m=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";if(m!=="light")m="dark";
document.documentElement.dataset.theme=m;document.documentElement.dataset.palette=q.get("palette")||a.palette||"classic";}catch(e){}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">

  <div id="live" class="sr" role="status" aria-live="polite"></div>
  <button id="fab" class="fab" hidden data-act="addhw"></button>
  <nav id="nav" aria-label="Main"></nav>
  <div id="back"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
</div>
