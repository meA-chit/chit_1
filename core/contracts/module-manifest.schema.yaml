# Draft schema for module.manifest.yaml (informal; convert to JSON Schema when validation is added)
id: string                  # kebab-case, equals folder name
title: string
version: semver
status: structure-only | in-progress | pilot | stable
depends_on: [module id]
privacy_class: normal | sensitive | strict
audiences: [adult | child | guest]
surfaces: [tv | tablet | web | mobile-adult | mobile-kid]
submodules:
  - id: string
    depends_on: [submodule id]   # optional
cards:
  - id: string
    submodule: string
    sizes: [s | m | l | xl]
    surfaces: [surface]
    permissions: [string]
    data_states: [available | stale | partial | unavailable | unconfigured | demo]
views:
  - id: string
    submodule: string
    surfaces: [surface]
permissions: [string]
events_published: [string]      # <entity>.<verb>
events_consumed: [string]

# Added with the hub rework (see docs/decisions/0008-*.md):
#   cards[].title / views[].title: string        # label shown by the shell
#   cards[].privacy_class: normal|sensitive|strict   # optional; overrides the module class for this card
#   views[].legacy_url: string                   # optional; full-page prototype served until ported
#   Routes: a submodule's server/routes.py defines register(router); every route must start with /api/<module-id>/
#   Web: a submodule's web/index.ts default-exports ModuleWeb (core/web/src/registry/types.ts); the card/view
#        ids in the manifest are the keys.
#   cards[].slot: topbar|timeline|timeline-side|left|center|right   # where the shell places the card (required)
#   cards[].group: string                               # cards sharing slot+group are shown as tabs of one panel
#   cards[].order: int                                  # sort order across the dashboard (default 100)
#   cards[].data_states may include manual (typed in by the household), forecast, demo (illustrative, never fact)
#   settings_sections: [{id, submodule, title, target: household, order, surfaces}]
#       A module contributes a section to another module's settings screen (e.g. planner chores and reminders appear in
#       the household screen). The web side exports it under ModuleWeb.settings[id]. Sections save themselves via the
#       contributing module's own API; the host screen never imports module code.
#   nav: bool (default true)                          # false: no rail entry of its own; the module's cards still show on Home and another module's page presents it
#   needs_children: bool (default false)               # true: the module is off, and cannot be switched on, in a household with no child
