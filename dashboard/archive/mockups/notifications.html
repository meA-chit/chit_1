<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chit — Notifications</title><style>body{margin:0;background:#f7f8f4;color:#17231f;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:760px;margin:42px auto;padding:22px}.card{background:#fff;border:1px solid #e3e8e2;border-radius:18px;padding:25px}h1{font-size:38px;letter-spacing:-.04em;margin:5px 0 25px}.notice{display:grid;grid-template-columns:12px 1fr auto;gap:14px;padding:17px 0;border-bottom:1px solid #e3e8e2}.dot{width:9px;height:9px;border-radius:50%;background:#2c735d;margin-top:7px}.muted{color:#6d7873;font-size:13px;margin-top:4px}time{color:#6d7873;font-size:12px;white-space:nowrap}</style></head><body><main class="wrap"><div class="card"><h1>Notifications</h1><div class="notice"><span class="dot"></span><div><strong>You were assigned Book the boiler service</strong><div class="muted">Your attention is needed today.</div></div><time>Yesterday</time></div><div class="notice"><span class="dot"></span><div><strong>Anna completed Buy compost</strong><div class="muted">The chit is ready to review.</div></div><time>35 min</time></div><div class="notice"><span class="dot"></span><div><strong>Leo invited you to Munich household</strong><div class="muted">You are now a member of the workspace.</div></div><time>Monday</time></div></div></main></body></html>
