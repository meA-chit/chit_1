<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chit — Create</title><style>body{margin:0;background:#f7f8f4;color:#17231f;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:760px;margin:50px auto;padding:24px}.card{background:#fff;border:1px solid #e3e8e2;border-radius:18px;padding:28px;box-shadow:0 18px 50px #273b3114}h1{margin:6px 0 24px;font-size:38px;letter-spacing:-.04em}.eyebrow{color:#2c735d;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d8e0da;border-radius:10px;padding:12px;background:#fff;font:inherit}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700}.secondary{background:#eef2ee;color:#234238}.primary{background:#2c735d;color:#fff}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{margin:20px auto;padding:15px}}</style></head><body><main class="wrap"><div class="card"><div class="eyebrow">New chit</div><h1>What needs doing?</h1><form><label for="title">Title</label><input id="title" placeholder="e.g. Book the boiler service"><label for="description">Details</label><textarea id="description" placeholder="Add useful context, links, or instructions"></textarea><div class="row"><div><label for="owner">Assign to</label><select id="owner"><option>Me</option><option>Anna</option><option>Everyone</option></select></div><div><label for="due">Due date</label><input id="due" type="date"></div></div><label for="category">Category</label><select id="category"><option>Home</option><option>Family</option><option>Personal</option><option>Garden</option></select><div class="actions"><button class="secondary" type="button">Cancel</button><button class="primary" type="submit">Create chit</button></div></form></div></main></body></html>
