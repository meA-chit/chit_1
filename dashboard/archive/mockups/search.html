<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chit — Search</title><style>body{margin:0;background:#f7f8f4;color:#17231f;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:42px auto;padding:22px}.card{background:#fff;border:1px solid #e3e8e2;border-radius:18px;padding:25px}.search{display:flex;gap:10px}input{flex:1;border:1px solid #d8e0da;border-radius:10px;padding:13px;font:inherit}button{border:0;border-radius:10px;padding:12px 17px;background:#2c735d;color:#fff;font-weight:700}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.filter{background:#eef2ee;color:#234238;border:1px solid #dce6df}.result{display:flex;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid #e3e8e2}.muted{color:#6d7873;font-size:13px}.tag{color:#2c735d;font-size:12px;font-weight:700;white-space:nowrap}@media(max-width:600px){.search{display:grid}.result{display:block}.tag{display:block;margin-top:7px}}</style></head><body><main class="wrap"><div class="card"><div class="search"><input placeholder="Search chits, people, or categories" autofocus><button>Search</button></div><div class="filters"><button class="filter">All statuses</button><button class="filter">Any person</button><button class="filter">Any category</button></div><div class="result"><div><strong>Book the boiler service</strong><div class="muted">Assigned to you · Home · Due today</div></div><span class="tag">Open</span></div><div class="result"><div><strong>Plan October garden work</strong><div class="muted">Assigned to everyone · Garden · Due 28 Sep</div></div><span class="tag">Open</span></div></div></main></body></html>
