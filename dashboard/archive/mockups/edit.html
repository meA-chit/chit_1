<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chit — Edit</title><style>body{margin:0;background:#f7f8f4;color:#17231f;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:760px;margin:50px auto;padding:24px}.card{background:#fff;border:1px solid #e3e8e2;border-radius:18px;padding:28px}h1{font-size:36px;margin:5px 0 24px;letter-spacing:-.04em}.eyebrow{color:#2c735d;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}label{display:block;font-weight:700;margin:17px 0 7px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d8e0da;border-radius:10px;padding:12px;font:inherit}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;justify-content:space-between;margin-top:24px}button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700}.danger{color:#a04b41;background:#faece9}.primary{background:#2c735d;color:#fff}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><div class="eyebrow">Edit chit</div><h1>Book the boiler service</h1><form><label for="title">Title</label><input id="title" value="Book the boiler service"><label for="description">Details</label><textarea id="description">Use the preferred local provider and add the appointment to the shared calendar.</textarea><div class="row"><div><label for="owner">Assign to</label><select id="owner"><option>Me</option><option>Anna</option><option>Everyone</option></select></div><div><label for="due">Due date</label><input id="due" type="date" value="2026-09-24"></div></div><label for="category">Category</label><select id="category"><option>Home</option><option>Family</option><option>Personal</option><option>Garden</option></select><div class="actions"><button class="danger" type="button">Delete chit</button><button class="primary" type="submit">Save changes</button></div></form></div></main></body></html>
